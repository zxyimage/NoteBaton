name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test ../scripts/tests/check-public-files.test.mjs && node ../scripts/check-public-files.mjs
      - run: npm ci
      - run: npm run cf:typegen && npm run typecheck && npm run check:notices && npm run check:legal && npm run check:locales && npm run build:app-resources && npm run build && npm run build:site
      - name: Check generated files
        run: git diff --exit-code -- worker-configuration.d.ts public/third-party-notices.txt public/privacy public/terms public/app-privacy ../THIRD_PARTY_NOTICES.txt ../ios/Clipboard/Markdown ../ios/Clipboard/Legal ../ios/Clipboard/en.lproj ../ios/Clipboard/zh-Hans.lproj
      - name: Test local Worker
        run: |
          npx wrangler dev --env-file .dev.vars.example --ip 127.0.0.1 --port 8788 > /tmp/relay-worker.log 2>&1 &
          worker_pid=$!
          npx wrangler dev --config wrangler.site.jsonc --env-file .dev.vars.example --ip 127.0.0.1 --port 8790 > /tmp/site-worker.log 2>&1 &
          site_pid=$!
          trap 'kill "$worker_pid" "$site_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            if curl --fail --silent http://127.0.0.1:8788/api/info > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/relay-worker.log; exit 1; fi
          site_ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$site_pid" 2>/dev/null; then break; fi
            if curl --fail --silent http://127.0.0.1:8790/api/info > /dev/null; then site_ready=1; break; fi
            sleep 1
          done
          if [ "$site_ready" -ne 1 ]; then cat /tmp/site-worker.log; exit 1; fi
          TEST_BASE_URL=http://127.0.0.1:8788 TEST_SITE_BASE_URL=http://127.0.0.1:8790 npm test
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: ./ios/scripts/test-local-notes.sh && ./ios/scripts/test-replication.sh && ./ios/scripts/test-pairing.sh && ./ios/scripts/test-e2ee.sh
      - name: Compile app without private signing configuration
        run: |
          xcodebuild -project ios/Clipboard.xcodeproj -scheme NoteBaton -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/relay-build" CODE_SIGNING_ALLOWED=NO build > /tmp/relay-build.log 2>&1 || { tail -100 /tmp/relay-build.log; exit 1; }

      - name: Compile native macOS app
        run: |
          xcodebuild -project ios/Clipboard.xcodeproj -scheme NoteBatonMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/notebaton-mac" \
            CODE_SIGNING_ALLOWED=NO build > /tmp/notebaton-mac.log 2>&1 || { tail -100 /tmp/notebaton-mac.log; exit 1; }
      - name: Verify native replication through a local Worker
        run: |
          npm run build --prefix web
          (cd web && npx wrangler dev --env-file .dev.vars.example --ip 127.0.0.1 --port 8789) > /tmp/notebaton-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            if curl --fail --silent http://127.0.0.1:8789/api/info > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/notebaton-worker.log; exit 1; fi
          TEST_BASE_URL=http://127.0.0.1:8789 ./ios/scripts/test-sync-integration.sh
