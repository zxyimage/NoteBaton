name: Clipboard
options:
  bundleIdPrefix: org.notebaton
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: '1.0.0'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NoteBaton:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Clipboard
        excludes: [Markdown, Legal]
      - path: Clipboard/Markdown
        type: folder
        buildPhase: resources
      - path: Clipboard/Legal
        type: folder
        buildPhase: resources
    info:
      path: Clipboard/Info.plist
      properties:
        CFBundleDisplayName: NoteBaton
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Use the camera to scan pairing QR codes from a browser, iPhone, or Mac and set up note sync.
        NSLocalNetworkUsageDescription: Connect to the NoteBaton service you select on your local network to sync notes between paired devices and browsers.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CURRENT_PROJECT_VERSION: 8
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # The native Mac app is built by NoteBatonMac, with its own sources.
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NoteBaton
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      configs:
        Debug:
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
          ENABLE_RESOURCE_ACCESS_CAMERA: YES
          REGISTER_APP_GROUPS: YES
    scheme:
      testTargets: []
  NoteBatonMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Clipboard
        excludes: [Views.swift, QRScanner.swift, Info.plist, Assets.xcassets, Markdown, Legal]
      - path: ../macos
        excludes: [Info.plist, README.md, scripts]
      - path: Clipboard/Markdown
        type: folder
        buildPhase: resources
      - path: Clipboard/Legal
        type: folder
        buildPhase: resources
    info:
      path: ../macos/Info.plist
      properties:
        CFBundleDisplayName: NoteBaton
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to the NoteBaton service you select on your local network to sync notes between paired devices and browsers.
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: NoteBaton
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        PRODUCT_BUNDLE_IDENTIFIER: org.notebaton.mac
        PRODUCT_NAME: NoteBaton
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: macosx
        TARGETED_DEVICE_FAMILY: ''
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: Apple Development
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []
